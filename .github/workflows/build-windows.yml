name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt flet-cli pyinstaller

      - name: Package application
        run: flet pack main.py --name LarpSenseNFA --add-data "assets;assets"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LarpSenseNFA-Windows
          path: dist/**
          if-no-files-found: error
